name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest -v

      - name: Core Audio smoke test
        continue-on-error: true
        run: python -c "from audio_devices.core import CoreAudioBackend as B; b = B(); print('render', b.list_devices('render')); print('capture', b.list_devices('capture'))"

      - name: Build exe
        run: python -m PyInstaller --noconfirm --noconsole --onefile --name MicSwitcher --icon MicSwitcher.ico --hidden-import audio_devices.core --hidden-import audio_devices.svv mic_switcher_tray.py

      - name: Bundle RNNoise plugin
        shell: pwsh
        run: |
          python -c "import installer as i; i.extract_rnnoise(i.download(i.RNNOISE_ZIP_URL, i.RNNOISE_ZIP_SHA256, 'win-rnnoise.zip'), 'bundle/plugins/rnnoise')"
          curl.exe -sSfL -o bundle/plugins/rnnoise/LICENSE-GPL-3.0.txt https://raw.githubusercontent.com/werman/noise-suppression-for-voice/v1.10/LICENSE
          $source = python -c "import installer as i; print(i.RNNOISE_SOURCE_URL)"
          @(
            "RNNoise noise suppression for voice v1.10 (VST2), werman/noise-suppression-for-voice.",
            "Unmodified binaries, distributed under GPL-3.0 (LICENSE-GPL-3.0.txt).",
            "Source code: $source",
            "MicSwitcher copies these files into <Equalizer APO>\VSTPlugins\RNNoise when noise suppression is enabled."
          ) | Out-File -Encoding utf8 bundle/plugins/rnnoise/README.txt

      - name: Package
        shell: pwsh
        run: |
          $name = "MicSwitcher_portable_${{ github.ref_name }}"
          New-Item -ItemType Directory -Path $name | Out-Null
          Copy-Item dist/MicSwitcher.exe, README.md, LICENSE, config.example.json -Destination $name
          Copy-Item -Recurse bundle/plugins -Destination $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          "ZIP=$name.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/upload-artifact@v4
        with:
          name: MicSwitcher
          path: ${{ env.ZIP }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP }}
